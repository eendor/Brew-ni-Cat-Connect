name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use the project npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm run audit

      - name: Check formatting
        run: npm run format:check

      - name: Validate specification documentation
        run: python3 scripts/validate_phase0_docs.py

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test

      - name: Build production application
        run: npm run build

  e2e:
    name: Browser tests (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder-publishable-key"
      # Place order is tested against a mocked order API (TC-P4-123)
      NEXT_PUBLIC_ONLINE_ORDERING: "enabled"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use the project npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build

      # CI runs headless, so only the headless shell is downloaded. The runner
      # already has Chromium's system libraries, so the slow apt install runs
      # only when the browser can't start without it.
      - name: Install Playwright Chromium
        run: |
          npx playwright install --only-shell chromium
          node -e "require('@playwright/test').chromium.launch({ timeout: 30000 }).then((b) => b.close())" \
            || npx playwright install-deps chromium

      - name: Run browser tests (chromium)
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
