name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Use the project npm version
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Audit production and development dependencies
        run: npm run audit

      - name: Check formatting
        run: npm run format:check

      - name: Validate specification documentation
        run: python3 scripts/validate_phase0_docs.py

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm run test

      - name: Build production application
        run: npm run build

      # Playwright remains a required local Phase 1 check; browser installation is
      # intentionally omitted here to keep this initial CI workflow lightweight.
